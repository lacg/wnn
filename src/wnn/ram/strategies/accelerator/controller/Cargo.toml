[package]
name = "ram_controller"
version = "2026.212.37"
edition = "2021"

[lib]
name = "ram_controller"
crate-type = ["cdylib"]
path = "lib.rs"
# The drone-controller wheel (paper #1). Separate cdylib so a controller-only
# change rebuilds ONLY this wheel — the IDS/LM worker (ram_accelerator) is
# untouched, so no worker swap is needed. Links ram_core for shared substrate.

[features]
# extension-module tells pyo3 NOT to link libpython: the CPython host supplies the
# symbols when it dlopens the wheel. That is required for the cdylib and fatal for a
# `cargo test` binary, which is a standalone executable and must resolve them itself —
# so an unconditional extension-module made `cargo test -p ram_controller --lib` fail
# to link, and the 14 CPU/GPU parity sweeps were reachable ONLY from Python as a
# result. They are pure-Rust functions returning Vec<(case, ok, detail)>; nothing about
# them needed Python. Gating the feature is the standard pyo3 fix and is already the
# pattern ram_core uses (see core/Cargo.toml:14).
#   maturin develop --release          -> default features -> extension-module -> wheel
#   cargo test --no-default-features   -> links libpython  -> tests, incl. parity, run
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[dependencies]
ram_core = { path = "../core" }
pyo3 = { version = "0.23" }
numpy = "0.23"
rayon = "1.8"
dashmap = "6.1"
rand = { version = "0.8", features = ["small_rng"] }

# Metal GPU (Apple Silicon) — macOS only. Used by metal_controller.rs.
[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.33"
objc = "0.2"
