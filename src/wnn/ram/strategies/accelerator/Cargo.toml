# Workspace root. ram_accelerator (this package, the IDS/LM worker wheel) is the
# root package; ram_core (shared substrate rlib) and ram_controller (drone
# controller wheel) are members. A controller-only change rebuilds ONLY
# ram_controller — the worker wheel is untouched, so no worker swap is needed.
# (controller added to members when its crate lands — Task #5.)
[workspace]
members = ["core", "controller"]
resolver = "2"

[package]
name = "ram_accelerator"
version = "2026.212.37"
edition = "2021"

[lib]
name = "ram_accelerator"
crate-type = ["cdylib"]
path = "lib.rs"  # Source file in same directory

[dependencies]
# Shared WNN substrate (cells, packed bits, sparse Memory + GPU forward, cancel).
ram_core = { path = "core" }

# Python bindings (0.23+ supports Python 3.13)
pyo3 = { version = "0.23", features = ["extension-module"] }

# NumPy support for zero-copy array access
numpy = "0.23"

# CPU parallelism (like joblib but faster)
rayon = "1.8"

# Fast hash maps
rustc-hash = "1.1"

# Lock-free concurrent HashMap (faster than RwLock<FxHashMap>)
dashmap = "6.1"

# For bit manipulation
bitvec = "1.0"

# Random number generation (for parallel genome initialization)
rand = { version = "0.8", features = ["small_rng"] }

# Timestamp formatting for logging
chrono = "0.4"

# File locking for concurrent log writes
fs2 = "0.4"

# SQLite for direct database writes (v2 data model)

# Metal GPU (Apple Silicon) — macOS only
[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.33"
objc = "0.2"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
