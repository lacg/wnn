[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "weightless"
version = "0.1.0"
description = "Weightless (RAM) neural networks for scikit-learn: WiSARD with a six-mode cell ladder, order-independent training, CPU/Metal scoring"
authors = [{ name = "Luiz Alberto Crispiniano Garcia" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["weightless", "wisard", "ram", "neural-network", "scikit-learn", "n-tuple"]
classifiers = [
	"Development Status :: 3 - Alpha",
	"Intended Audience :: Science/Research",
	"License :: OSI Approved :: MIT License",
	"Programming Language :: Python :: 3",
	"Programming Language :: Rust",
	"Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
	"numpy>=1.24",
	"scikit-learn>=1.3",
]

[project.optional-dependencies]
gaussian = ["scipy>=1.10"]
test = ["pytest>=7"]

[tool.maturin]
# The Rust crate lives in the accelerator workspace (it links ram_core); this
# package is the Python half. `maturin develop --release` from this directory.
manifest-path = "../../src/wnn/ram/strategies/accelerator/public/Cargo.toml"
python-source = "python"
module-name = "weightless._core"
features = ["pyo3/extension-module"]
# No sdist yet: maturin cannot include files above the project root, and the
# crate depends on ram_core by PATH. Once ram_core is on crates.io (scope item C)
# the public crate depends on it by version and the sdist becomes self-contained.
